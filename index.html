<!-- Deliberately NO ?v= cache-buster on this link. It used to carry the build hash, which meant the
     address bar showed a different URL after every deploy and any bookmark taken from it went stale.

     minutes after a deploy a browser may still hold the previous copy — Ctrl+Shift+R forces it. -->

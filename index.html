<!--
================================================================================
AMERICAN RAILS — rules reference (Tim Harrison / Quined Games, 2013)
Every rule implemented below is listed here first.

COMPONENTS
- 6 companies (id, colour, cubes, shares): american(white,31,5) national(grey,29,4)
  continental(green,26,3) majestic(yellow,22,4) liberty(red,19,2) republic(blue,17,3).
  Totals: 144 cubes, 21 shares. 12 black development markers.
- Hex map. Terrain: city, plains, forest, mountain. Year track 1851..1857.

SETUP
- Money: 3p $50, 4p $50, 5p $40 each. 3 players: remove one random company.
- Company income starts at 0. 12 dev markers in supply.

PREPARATION ROUND: one share of EACH company is auctioned. Min bid $10; clockwise,
higher-or-pass; passed players are out; winner pays final bid into that company's
treasury and takes the share, then places one cube on any EMPTY city, setting the
company income to that city's FULL value (company now on the map). No bids -> share
removed. The OPENING turn order (round 1, phase 1) is the order players first win a
prep auction — 1st winner acts first, etc.; anyone who wins nothing goes last in seat order.

ROUND = 3 action phases + 1 dividend phase (up to 7 rounds, 1851..1857).

ACTION TRACK (rows = actions; a taken row blocks others that phase). Rows top->bottom:
Pass, Develop, Fund $5, Take $2 / Expand 2, Expand 3, Auction a share, Expand 4.
- Phase 1 order = opening turn order (see above). Phases 2-3 order = standings on the action track
  (top row acted first). Choosing a row blocks it even if you decline to implement.
- End of round: turn order for next round = last phase's standings; advance the year.

ACTIONS
- Pass: nothing.
- Develop: dev marker on an undeveloped non-hub city with >=1 cube; +$2 full/+$1 shared.
  Hubs (New York, Baltimore, Philadelphia, Boston, Chicago) can't be developed.
- Fund $5: $5 from bank to any one company treasury.
- Take $2: $2 from bank (personal) OR $2 from each other player. In 4-5p, may Expand 2.
- Auction a share: like prep auction; off-map company winner places a starting cube.
- Expand 2/3/4: place up to N cubes one at a time, each of a company you hold a share
  in, on a hex adjacent to a same-colour cube. Pay from that company treasury:
  city/plains $2 + $2 per cube/dev already in hex; forest $3 (max 1); mountain $5 (max 1).
  No two same-colour cubes in a hex. Must afford full cost.

CITY INCOME (cube enters a city): 1st company +full; when a 2nd company enters, newcomer
+shared and incumbents drop full->shared; 3rd+ +shared. Dev marker: +$2 full/+$1 shared
(each company's dev bonus is +$1 once the city is shared).
SPECIAL CONNECTIONS: connecting Chicago<->New York, Chicago<->Atlanta, or New York<->Atlanta
= +$10 once per pair (the third city completes two at once = +$20).

DIVIDENDS (end of round): each company pays ceil(income / player-held shares) per share.
Unsold/removed shares don't count.

END (after a dividend): year 1857 reached, OR all shares sold/removed, OR supplies (cube
piles + dev pile) at <=2: 3p:3, 4p:4, 5p:5. Most money wins; ties share.
================================================================================
-->

#log { font-size: var(--font-size-sm); max-height: 30vh; overflow-y: auto; }
#log .log-line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.05); color: var(--color-text-muted); }
#log .log-line:last-child { color: var(--color-text); }
.banner { text-align:center; padding: var(--space-md); background: var(--color-accent); color: var(--color-ink); border-radius: var(--radius); font-family: var(--font-display); font-size: var(--font-size-lg); font-weight: 700; }
.hidden { display: none !important; }
@media (max-width: 900px) { #game.active { flex-direction: column; height: auto; } .sidebar { flex-basis: auto; border-left: none; border-top: 1px solid var(--color-border); } }
</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body>

<div id="lobby" data-screen="lobby">
  <h1>AMERICAN RAILS</h1>
  <div class="subtitle">Build railroads, buy shares, chase the biggest dividends.</div>
  <div class="mode-buttons">
    <button data-action="resume" id="resume-btn" style="display:none">↩ Resume Last Game</button>
    <button data-action="mode-local" id="btn-local">Local Game (one screen)</button>
    <button data-action="mode-host" id="btn-host">Host Online Game</button>
    <button data-action="mode-join" id="btn-join">Join Online Game</button>
  </div>
  <div id="player-config" class="panel-box hidden">
    <div class="field-row"><label>Players:
      <select id="player-count"><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option></select>
    </label></div>
    <div id="player-names" class="player-names-list"></div>
    <button id="start-game" data-action="start-game">Start Game</button>
  </div>
  <!-- The room. Host and guests both land here, so a guest can see they are in and who else is
       waiting; the controls only the host can use are marked .host-only and hidden for guests. -->
  <div id="host-view" class="panel-box hidden">
    <div class="field-row host-only"><label>Your name: <input id="host-name" maxlength="16" value="Host"></label></div>
    <div class="label" id="room-code-label">Room code — share with your friends</div>
    <div class="room-code" id="room-code" data-room-code>----</div>
    <div id="connected-players" style="margin:var(--space-md) 0;" class="label">Waiting for players…</div>
    <div class="field-row host-only" style="gap:6px;flex-wrap:wrap;align-items:center;">
      <span class="label">Fill seats with bots:</span>
      <button data-action="add-bot" data-bot="easy" class="ghost">+ Training</button>
      <button data-action="add-bot" data-bot="medium" class="ghost">+ Easy</button>
      <button data-action="add-bot" data-bot="hard" class="ghost">+ Medium</button>
      <button data-action="add-bot" data-bot="extreme" class="ghost">+ Hard</button>
      <button data-action="remove-bot" class="ghost">Remove bot</button>
    </div>
    <button id="start-online" class="host-only" data-action="start-online" disabled>Start Game</button>
    <div id="guest-wait" class="guest-wait hidden">
      <span class="waiting-dot"></span><span id="guest-wait-text">Waiting for the host to start the game…</span>
    </div>
    <button id="leave-room" class="ghost hidden" data-action="leave-room">Leave room</button>
  </div>
  <div id="join-view" class="panel-box hidden">
    <div class="field-row"><label>Your name: <input id="join-name" maxlength="16" placeholder="Name"></label></div>
    <div class="field-row"><label>Room code: <input id="room-input" maxlength="6" placeholder="ABCD" style="text-transform:uppercase;width:120px;"></label>
      <button id="join-btn" data-action="join">Join</button></div>
    <p id="join-status" class="label"></p>
  </div>
</div>

<div id="game" data-screen="game">
  <main class="board-area">
    <div class="topbar">
      <h2>AMERICAN RAILS</h2>
      <div class="year-chip">Year <span class="mono" id="year-label" data-year>1851</span></div>
      <div class="turn-status" id="turn-status" data-turn-status></div>
      <div class="actions-bar" id="actions-bar" data-actions></div>
      <button class="ghost topbar-leave" data-action="quit" title="Local games are saved — resume from the menu">Save &amp; exit</button>
    </div>
    <div class="board-stage">
      <div class="board-wrap" id="board-wrap" data-board></div>
      <div class="zoom-ctl" id="zoom-ctl">
        <button data-action="zoom-toggle" class="zoom-main" title="Zoom"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="21" y2="21"/></svg></button>
        <div class="zoom-opts" id="zoom-opts" hidden>
          <button data-action="zoom-in" title="Zoom in">+</button>
          <button data-action="zoom-out" title="Zoom out">&minus;</button>
          <button data-action="zoom-fit" title="Fit board">&#9633;</button>
        </div>
      </div>
      <div class="opts-ctl" id="opts-ctl">
        <div class="opts-menu" id="opts-menu" hidden>
          <div class="opts-title">Bot speed</div>
          <button data-action="botspeed" data-bs="slow">Slow</button>
          <button data-action="botspeed" data-bs="normal" class="active">Normal</button>
          <button data-action="botspeed" data-bs="fast">Fast</button>
          <div class="opts-title" style="margin-top:6px">Cube layout</div>
          <button data-action="cubes-scattered" data-style="scattered" class="active">Scattered</button>
          <button data-action="cubes-tidy" data-style="tidy">Tidy</button>
          <div class="opts-title" style="margin-top:6px">Share this game</div>
          <button data-action="copy-log" id="copy-log-btn">📋 Copy game report</button>
        </div>
        <button data-action="opts-toggle" class="opts-main" title="Board options"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.2 2.2M16.8 16.8L19 19M19 5l-2.2 2.2M7.2 16.8L5 19"/></svg></button>
      </div>
    </div>
  </main>
  <div class="sidebar">
    <div class="card"><h3>Players</h3><div id="players" data-players></div></div>
    <div class="card"><h3>Railroad Companies</h3><div id="companies" data-companies></div></div>
    <div class="card"><h3>Log</h3><div id="log" data-log></div></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>

function hexPixel(c,r){ return { x: OX + c*HW + (r&1)*HW/2, y: OY + r*RP }; }
function hexPoints(cx,cy,r){ r=r||HEX; let p=''; for (let i=0;i<6;i++){ const a=Math.PI/180*(60*i-30); p+=(cx+r*Math.cos(a)).toFixed(2)+','+(cy+r*Math.sin(a)).toFixed(2)+' '; } return p.trim(); }
// deterministic per-hex RNG so each tile is unique but stable
function hexRng(c,r){ let a=((c*73856093)^(r*19349663))>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function R(rng,a,b){ return a+(b-a)*rng(); }
function inHex(rng,rad){ const r=(rad||0.7)*HEX*Math.sqrt(rng()), t=rng()*6.2832; return [Math.cos(t)*r, Math.sin(t)*r]; }

/* ============================ 3. STATE & SETUP ============================ */
function startingMoney(n){ return n===5?40:50; }
function pushLog(s,m){ s.log.push(m); if (s.log.length>240) s.log.shift(); }
function ensureHex(s,id){ if (!s.hexes[id]) s.hexes[id]={cubes:[],developed:false}; return s.hexes[id]; }
function isRemoved(c){ return c.removed===true; }
function activeCompanyIds(s){ return COMPANY_IDS.filter(id=>!isRemoved(s.companies[id])); }
function rotatedOrder(s, starter){ const n=s.players.length,o=[]; for(let i=0;i<n;i++) o.push((starter+i)%n); return o; }

function createInitialState(config){
  const names = config.names, n = names.length;
  const companies = {};
  for (const id of COMPANY_IDS) companies[id] = { treasury:0, income:0, sharesInSupply:COMPANIES[id].shares, sharesRemoved:0, cubesInSupply:COMPANIES[id].cubes, onMap:false, bonuses:[], removed:false };
  const state = {
    phase:'setup', mode: config.mode||'local',
    players: names.map((nm,i)=>({ id:i, name:nm, money:startingMoney(n), shares:[], connected:true, bot:(config.bots&&config.bots[i])||null })),
    companies, hexes:{}, developmentSupply:TOTAL_DEV_MARKERS,
    year:1851, round:0, actionPhase:0,
    turnOrder: names.map((_,i)=>i), currentPlayer:0,
    turnPhase:'bidding', pending:null, auction:null, pendingStartCube:null,
    startCubeUndo:null, startCubeHex:null,   // the placed-but-not-yet-confirmed first cube
    setupQueue:[], auctionStarter:0, setupWinOrder:[], // order players first win a prep auction → sets the opening turn order
    phaseOrder:[], phaseQueue:[], takenRows:{}, picks:{},
    log:[], winner:null, history:[], config, localPlayerId:0,
    seed: (config.seed!=null ? config.seed : Math.floor(Math.random()*1e9)),  // drives bot "dice" — same seed, same bots
  };
  // deal each bot a bidding personality, so the auctions play differently every game
  { const pool=PERSONA_IDS.slice();
    state.players.forEach((p,i)=>{ if(p.bot){ const k=Math.floor(botNoise(state,i,'persona')*pool.length);
      p.persona = pool.splice(Math.min(k,pool.length-1),1)[0] || PERSONA_IDS[i%PERSONA_IDS.length]; } }); }
  // 3-player: remove one random company (randomness stored via chosen id)
  if (n===3){ const rid = config.removed || COMPANY_IDS[Math.floor(Math.random()*COMPANY_IDS.length)];
    const c = companies[rid]; c.removed=true; c.cubesInSupply=0; c.sharesInSupply=0; c.sharesRemoved=COMPANIES[rid].shares;
    pushLog(state, `${COMPANIES[rid].name} removed (3-player game).`); }
  pushLog(state, `Game started — ${n} players.`);
  startPreparationAuction(state);
  return state;
}

/* ============================ 4. AUCTIONS ============================ */
function startPreparationAuction(s){ s.phase='setup'; s.setupQueue = activeCompanyIds(s).slice(); pushLog(s,'Preparation round: one share of each company is auctioned.'); nextPreparationAuction(s); }
function nextPreparationAuction(s){ if (s.setupQueue.length===0){ beginPlayRounds(s); return; } const cid = s.setupQueue.shift(); openAuction(s, cid, s.auctionStarter, true); }

function openAuction(s, companyId, starter, isSetup){
  const order = rotatedOrder(s, starter);
  s.auction = { companyId, isSetup, bid:0, highBidder:null, active:order.slice(), cur:0 };
  s.turnPhase = 'bidding';
  setBiddingCurrent(s);
  pushLog(s, `Auction: a ${COMPANIES[companyId].name} share (min $10).`);
}
function setBiddingCurrent(s){ const a=s.auction; if (!a) return; let guard=0;
  while (guard++ < 80){
    if (a.active.length===0){ resolveAuction(s); return; }
    if (a.highBidder!==null && a.active.length===1 && a.active[0]===a.highBidder){ resolveAuction(s); return; }
    if (a.active.length>1 && a.active[a.cur]===a.highBidder){ a.cur=(a.cur+1)%a.active.length; continue; }
    const bidder=a.active[a.cur], minNext = a.bid===0?10:a.bid+1;
    if (s.players[bidder].money < minNext){ // can't afford the minimum — auto-skip
      pushLog(s, `${s.players[bidder].name} can't afford $${minNext} — auto-passes.`);
      a.active.splice(a.cur,1); if (a.cur>=a.active.length) a.cur=0; continue;
    }
    break;
  }
  s.currentPlayer = a.active[a.cur];
}
function auctionMinNext(s){ const a=s.auction; return a.bid===0?10:a.bid+1; }
function bid(s, amount){
  const a=s.auction; if (!a) return false; const bidder=a.active[a.cur];
  amount = Math.floor(amount);
  if (amount < 10 || amount <= a.bid) return false;
  if (s.players[bidder].money < amount) return false;
  a.bid=amount; a.highBidder=bidder; pushLog(s, `${s.players[bidder].name} bids $${amount}.`);
  a.cur = (a.cur+1) % a.active.length;
  setBiddingCurrent(s);
  return true;
}
function passBid(s){
  const a=s.auction; if (!a) return false; const bidder=a.active[a.cur];
  pushLog(s, `${s.players[bidder].name} passes.`);
  a.active.splice(a.cur,1);
  if (a.cur >= a.active.length) a.cur = 0;
  if (a.active.length===0){ resolveAuction(s); return true; }
  if (a.active.length===1 && a.highBidder!==null){ resolveAuction(s); return true; }
  setBiddingCurrent(s);
  return true;
}
function resolveAuction(s){
  const a=s.auction, cid=a.companyId, co=s.companies[cid];
  if (a.highBidder===null){ co.sharesInSupply--; co.sharesRemoved++; pushLog(s, `No bids — a ${COMPANIES[cid].name} share is removed.`); finishAuction(s, null); return; }
  const w = s.players[a.highBidder];
  w.money -= a.bid; w.shares.push(cid); co.treasury += a.bid; co.sharesInSupply--;
  pushLog(s, `${w.name} wins a ${COMPANIES[cid].name} share for $${a.bid}.`);
  if (!co.onMap){ s.pendingStartCube = { companyId:cid, playerId:a.highBidder }; s.turnPhase='placeStartCube'; s.currentPlayer=a.highBidder; s.auction=null; return; }
  finishAuction(s, a.highBidder);
}
// Winning a share puts your company's FIRST cube on the map, which fixes its income for the rest of
// the game — too important to lose to a misclick. The cube goes down so you can see it in place, then
// waits on Confirm; Back restores the moment before you clicked and lets you choose again.
function placeStartingCube(s, hexId){
  const ps=s.pendingStartCube; if (!ps) return false; const def=BOARD[hexId]; if (!def || !def.city) return false;
  const hs=s.hexes[hexId]; if (hs && hs.cubes.length) return false;
  const undo = snapStartCube(s);                       // captured BEFORE the cube lands
  ensureHex(s,hexId).cubes.push(ps.companyId);
  const co=s.companies[ps.companyId]; co.cubesInSupply--; co.onMap=true; co.income=def.city.full;
  applySpecialConnections(s, ps.companyId);
  s.startCubeUndo = undo; s.startCubeHex = hexId; s.turnPhase='confirmStartCube';
  return true;
}
function snapStartCube(s){ const {startCubeUndo, turnSnapshot, ...rest}=s; return JSON.stringify(rest); }
function confirmStartCube(s){
  if (s.turnPhase!=='confirmStartCube') return false;
  const ps=s.pendingStartCube, def=BOARD[s.startCubeHex];
  pushLog(s, `${COMPANIES[ps.companyId].name} starts at ${def.city.name} (income ${def.city.full}).`);
  const seat=ps.playerId;
  s.pendingStartCube=null; s.startCubeUndo=null; s.startCubeHex=null;
  finishAuction(s, seat); return true;
}
function undoStartCube(s){
  if (s.turnPhase!=='confirmStartCube' || !s.startCubeUndo) return false;
  const snap=JSON.parse(s.startCubeUndo);
  for (const k of Object.keys(snap)) s[k]=snap[k];
  s.startCubeUndo=null; s.startCubeHex=null; s.turnPhase='placeStartCube'; return true;
}
function finishAuction(s, winnerSeat){
  s.auction=null;
  if (s.phase==='setup'){ if (winnerSeat!=null){ s.auctionStarter=winnerSeat; if(!s.setupWinOrder.includes(winnerSeat)) s.setupWinOrder.push(winnerSeat); } nextPreparationAuction(s); }
  else { advanceAfterAction(s); } // auction already resolved publicly — nothing to confirm/redo, just advance
}

/* ============================ 5. INCOME ============================ */
function applyCityEntry(s, hexId, companyId){
  const def=BOARD[hexId]; if (!def.city) return;
  const hs=s.hexes[hexId]; const distinct=[...new Set(hs.cubes)]; const dev=hs.developed;
  const full=def.city.full, shared=def.city.shared;
  if (distinct.length===1){ s.companies[companyId].income += full + (dev?2:0); }
  else { if (distinct.length===2){ distinct.filter(id=>id!==companyId).forEach(id=>{ s.companies[id].income -= (full-shared); if (dev) s.companies[id].income -= 1; }); }
    s.companies[companyId].income += shared + (dev?1:0); }
}
function applyDevelopment(s, hexId){ const cubes=[...new Set(s.hexes[hexId].cubes)]; const bonus = cubes.length>=2?1:2; cubes.forEach(id=> s.companies[id].income += bonus); }
function connectedCities(s, companyId){
  const start=Object.keys(s.hexes).filter(id=> s.hexes[id].cubes.includes(companyId));
  const seen=new Set(start), q=[...start], cities=new Set();
  while (q.length){ const id=q.shift(); if (BOARD[id].city) cities.add(BOARD[id].city.name);
    for (const nb of BOARD[id].adj){ if (!seen.has(nb) && s.hexes[nb] && s.hexes[nb].cubes.includes(companyId)){ seen.add(nb); q.push(nb); } } }
  return cities;
}
function applySpecialConnections(s, companyId){
  const cities=connectedCities(s, companyId), co=s.companies[companyId];
  for (const [a,b] of [['Chicago','New York'],['Chicago','Atlanta'],['New York','Atlanta']]){
    const key=a+'-'+b;
    if (cities.has(a)&&cities.has(b)&&!co.bonuses.includes(key)){ co.bonuses.push(key); co.income+=10; pushLog(s, `${COMPANIES[companyId].name} connects ${a}–${b}: +$10.`); }
  }
}

/* ============================ 6. EXPAND ============================ */
function expandCost(s, hexId){ const def=BOARD[hexId], hs=s.hexes[hexId]||{cubes:[],developed:false};
  if (def.terrain==='forest') return 3; if (def.terrain==='mountain') return 5;
  let cost = 2 + 2*hs.cubes.length; return cost; } // $2 base + $2 per cube already there; a house (developed) adds no surcharge
function canPlaceCube(s, playerId, companyId, hexId){
  const p=s.players[playerId]; if (!p.shares.includes(companyId)) return {ok:false,reason:'You own no share of that company.'};
  const def=BOARD[hexId]; if (!def) return {ok:false,reason:'Not a hex.'};
  const hs=s.hexes[hexId]||{cubes:[],developed:false};
  if (hs.cubes.includes(companyId)) return {ok:false,reason:'That colour is already here.'};
  if ((def.terrain==='forest'||def.terrain==='mountain') && hs.cubes.length>=1) return {ok:false,reason:'Forest/mountain holds one cube.'};
  if (!def.adj.some(nb=> s.hexes[nb] && s.hexes[nb].cubes.includes(companyId))) return {ok:false,reason:'Must touch that company’s track.'};
  if (s.companies[companyId].cubesInSupply<=0) return {ok:false,reason:'No cubes left in supply.'};
  if (s.companies[companyId].treasury < expandCost(s,hexId)) return {ok:false,reason:'Company can’t afford it.'};
  return {ok:true};
}
function placeCube(s, playerId, companyId, hexId){
  const chk=canPlaceCube(s,playerId,companyId,hexId); if (!chk.ok) return chk;
  const cost=expandCost(s,hexId); const co=s.companies[companyId];
  co.treasury-=cost; co.cubesInSupply--; ensureHex(s,hexId).cubes.push(companyId);
  if (BOARD[hexId].city) applyCityEntry(s,hexId,companyId);
  applySpecialConnections(s, companyId);
  pushLog(s, `${s.players[playerId].name} expands ${COMPANIES[companyId].name} → ${BOARD[hexId].city?BOARD[hexId].city.name:hexId} ($${cost}).`);
  return {ok:true};
}
function legalExpandHexes(s, playerId, companyId){ return Object.keys(BOARD).filter(id=> canPlaceCube(s,playerId,companyId,id).ok); }
function ownedExpandableCompanies(s, playerId){
  const p=s.players[playerId];
  return [...new Set(p.shares)].filter(cid=> s.companies[cid].onMap && legalExpandHexes(s,playerId,cid).length>0);
}

/* ============================ 7. ACTION PHASES ============================ */
// player train markers on the action track: {phase:-1 turn-order (row=turn-order slot), 0/1/2 action column (row=ACTION_ROWS index)}
function initMarkers(s){ s.markers={}; s.turnOrder.forEach((seat,i)=>{ s.markers[seat]={phase:-1,row:i}; }); }
function beginPlayRounds(s){ s.round=1; s.year=1851;
  // opening turn order = the order players won prep auctions; anyone who won nothing keeps seating order at the back
  const won=s.setupWinOrder.slice(), rest=s.turnOrder.filter(seat=>!won.includes(seat));
  s.turnOrder = won.concat(rest);
  pushLog(s, `Turn order (by auction wins): ${s.turnOrder.map(i=>s.players[i].name).join(', ')}.`);
  startActionPhase(s, s.turnOrder.slice()); initMarkers(s); pushLog(s,'Round 1 (1851) begins.'); }
function startActionPhase(s, order){ s.phase='action'; s.phaseOrder=order.slice(); s.phaseQueue=order.slice(); s.takenRows={}; s.picks={}; s.turnPhase='chooseAction'; s.currentPlayer=s.phaseQueue[0]; s.pending=null; s.turnSnapshot=null; }
function availableActionRows(s){ return ACTION_ROWS.filter(r=>!s.takenRows[r]); }

function chooseAction(s, row){
  if (s.turnPhase!=='chooseAction' || s.takenRows[row]) return false;
  if (!s.turnSnapshot) s.turnSnapshot = snapTurn(s); // capture the start of this player's turn (for Redo)
  s.takenRows[row]=true; s.picks[s.currentPlayer]=row; s.pendingAction=row;
  if (s.markers) s.markers[s.currentPlayer]={phase:s.actionPhase,row:ACTION_ROWS.indexOf(row)};
  switch (row){
    case 'pass': pushLog(s, `${s.players[s.currentPlayer].name}: Pass.`); advanceAfterAction(s); break; // nothing to confirm — just advance
    case 'develop': s.turnPhase='developing'; break;
    case 'fund5': s.turnPhase='funding'; break;
    case 'take2': s.turnPhase='take2choice'; break;
    case 'auction': s.turnPhase='auctionSelect'; break;
    case 'expand3': case 'expand4': s.turnPhase='expanding'; s.pending={ remaining:EXPAND_COUNT[row], companyId:null }; break;
  }
  return true;
}
function decline(s){ // (auto-play only) decline to implement the chosen action; slot stays blocked
  pushLog(s, `${s.players[s.currentPlayer].name} declines to implement.`); advanceAfterAction(s);
}
// Back: undo the action just chosen (before anything is committed) so the player can pick again.
function goBack(s){
  const row = s.pendingAction; if (!row) return false;
  if (s.takenRows[row]) delete s.takenRows[row];
  delete s.picks[s.currentPlayer];
  s.pendingAction=null; s.pending=null; s.auction=null;
  if (s.markers){ const pos=s.phaseOrder.indexOf(s.currentPlayer); s.markers[s.currentPlayer]={phase:-1, row: pos<0?0:pos}; }
  s.turnPhase='chooseAction';
  pushLog(s, `${s.players[s.currentPlayer].name} goes back to reconsider.`);
  return true;
}
// --- Done turn / Redo turn: snapshot the whole state at the start of a player's turn ---
function snapTurn(s){ const {turnSnapshot, ...rest}=s; return JSON.stringify(rest); }
function completeAction(s){ s.turnPhase='turnDone'; } // hold until the player confirms 'Done turn'
function doneTurn(s){ if (s.turnPhase!=='turnDone') return false; advanceAfterAction(s); return true; }
function redoTurn(s){ if (!s.turnSnapshot) return false; const snap=JSON.parse(s.turnSnapshot);
  for (const k of Object.keys(snap)) s[k]=snap[k];
  pushLog(s, `${s.players[s.currentPlayer].name} redoes their turn.`); return true; }
function advanceAfterAction(s){
  s.pendingAction=null; s.pending=null;
  s.phaseQueue.shift();
  if (s.phaseQueue.length===0){ endActionPhase(s); }
  else { s.currentPlayer=s.phaseQueue[0]; s.turnPhase='chooseAction'; s.turnSnapshot=null; }
}
function endActionPhase(s){
  const order = s.phaseOrder.slice().sort((a,b)=> ACTION_ROWS.indexOf(s.picks[a]) - ACTION_ROWS.indexOf(s.picks[b]));
  if (s.actionPhase < 2){ s.actionPhase++; startActionPhase(s, order); }
  else { s.lastStandings = order; doDividends(s); }
}

/* -- individual actions -- */
function doFund5(s, companyId){ if (s.turnPhase!=='funding') return false; if (isRemoved(s.companies[companyId])) return false;
  s.companies[companyId].treasury += 5; pushLog(s, `${s.players[s.currentPlayer].name}: Fund $5 to ${COMPANIES[companyId].name}.`); completeAction(s); return true; }
function doTake2(s, mode){ if (s.turnPhase!=='take2choice') return false; const cur=s.currentPlayer;
  if (mode==='take'){ s.players[cur].money += 2; pushLog(s, `${s.players[cur].name}: Take $2 from the bank.`); }
  else if (mode==='fromEach'){ s.players.forEach((p,i)=>{ if (i!==cur) p.money = Math.max(0, p.money-2); }); pushLog(s, `${s.players[cur].name}: every other player pays $2 to the bank.`); }
  else return false;
  completeAction(s); return true; }
function doDevelop(s, hexId){ if (s.turnPhase!=='developing') return false;
  const def=BOARD[hexId]; if (!def||!def.city||!def.city.developable) return false;
  const hs=s.hexes[hexId]; if (!hs || hs.cubes.length===0 || hs.developed) return false;
  if (s.developmentSupply<=0) return false;
  if (!hs.cubes.some(cid=> s.players[s.currentPlayer].shares.includes(cid))) return false; // you must own a company with track here
  hs.developed=true; s.developmentSupply--; applyDevelopment(s, hexId);
  pushLog(s, `${s.players[s.currentPlayer].name}: Develop ${def.city.name}.`); completeAction(s); return true; }
function legalDevelopHexes(s){ const p=s.players[s.currentPlayer];
  return Object.keys(BOARD).filter(id=>{ const def=BOARD[id]; const hs=s.hexes[id];
    return def.city && def.city.developable && hs && hs.cubes.length>0 && !hs.developed && s.developmentSupply>0
      && p && hs.cubes.some(cid=> p.shares.includes(cid)); }); }

/* expand sub-flow */
function selectExpandCompany(s, companyId){ if (s.turnPhase!=='expanding'||!s.pending) return false;
  if (!ownedExpandableCompanies(s,s.currentPlayer).includes(companyId)) return false; s.pending.companyId=companyId; return true; }
function expandPlaceHex(s, hexId){ if (s.turnPhase!=='expanding'||!s.pending||!s.pending.companyId) return false;
  const r=placeCube(s, s.currentPlayer, s.pending.companyId, hexId); if (!r.ok) return false;
  s.pending.remaining--; s.pending.companyId=null;
  if (s.pending.remaining<=0 || ownedExpandableCompanies(s,s.currentPlayer).length===0) endExpand(s);
  return true; }
function endExpand(s){ pushLog(s, `${s.players[s.currentPlayer].name}: expansion done.`); completeAction(s); }

/* auction action */
function selectAuctionCompany(s, companyId){ if (s.turnPhase!=='auctionSelect') return false;
  if (s.companies[companyId].sharesInSupply<=0 || isRemoved(s.companies[companyId])) return false;
  openAuction(s, companyId, s.currentPlayer, false); return true; }

/* ============================ 8. DIVIDENDS & END ============================ */
let ANIM = true; // when false (self-test), dividends/end resolve instantly with no animation
// ordered dividend steps, most-expensive company first (activeCompanyIds is already in value order)
function computeDividends(s){ const steps=[];
  for (const id of activeCompanyIds(s)){ const c=s.companies[id];
    const held = s.players.reduce((n,p)=> n + p.shares.filter(x=>x===id).length, 0);
    if (held===0 || c.income<=0) continue;
    const per = Math.ceil(c.income/held);
    const payments = s.players.map((p,i)=>({player:i, cnt:p.shares.filter(x=>x===id).length})).filter(x=>x.cnt>0).map(x=>({player:x.player, amount:per*x.cnt}));
    steps.push({ company:id, per, income:c.income, held, payments });
  }
  return steps;
}
function applyDivStep(s, step){ step.payments.forEach(pm=> s.players[pm.player].money += pm.amount);
  pushLog(s, `${COMPANIES[step.company].name} pays $${step.per}/share (income ${step.income}, ${step.held} held).`); }
function doDividends(s){ const steps=computeDividends(s);
  if (!ANIM){ steps.forEach(st=>applyDivStep(s,st)); endRound(s); return; }
  // animated: pause the game, send the trains back to the turn-order numbers, then pay company-by-company
  s.phase='payout';
  if (s.markers) s.phaseOrder.forEach((seat,i)=>{ s.markers[seat]={phase:-1,row:i}; });
  s.payout = { steps, idx:-1 };
}
function suppliesLow(s){ let n=0; for (const id of COMPANY_IDS){ const c=s.companies[id]; if (!isRemoved(c) && c.cubesInSupply<=2) n++; } if (s.developmentSupply<=2) n++; return n; }
function endRound(s){
  s.turnOrder = (s.lastStandings||s.turnOrder).slice();
  const n=s.players.length, threshold = n===3?3:(n===4?4:5);
  const sharesLeft = COMPANY_IDS.reduce((t,id)=> t + s.companies[id].sharesInSupply, 0);
  if (s.year>=1857 || sharesLeft===0 || suppliesLow(s)>=threshold){ endGame(s); return; }
  s.round++; s.year++; s.actionPhase=0; startActionPhase(s, s.turnOrder.slice()); initMarkers(s); pushLog(s, `Round ${s.round} (${s.year}).`);
}
function endGame(s){ s.phase='gameOver'; const max=Math.max(...s.players.map(p=>p.money));
  s.winner = s.players.filter(p=>p.money===max).map(p=>p.id);
  pushLog(s, 'Game over. Winner: ' + s.winner.map(i=>s.players[i].name).join(', ') + ` ($${max}).`); }

/* ============================ 8b. BOTS (Easy / Medium / Hard) ============================ */
const COMPANY_START = { american:30, national:28, continental:25, majestic:21, liberty:18, republic:16 };
// Bidding personalities — rolled per bot seat at game start so no two games (and no two
// bots) haggle the same way. Difficulty still decides how GOOD the valuation is; the
// persona decides how it behaves with that number.
//   aggr        multiplier on what it thinks a share is worth
//   open        opening bid as a fraction of its ceiling (low = creeps in at $10)
//   jump        how much it raises over the minimum (0 = always the $1 minimum)
//   concentrate appetite for a 2nd/3rd share of a company it already holds

// the auction watch-bar: shows the company, high bid, the last move, and controls only for the active human
function biddingBar(s, cur, mine){

  const last = s.log[s.log.length-1] || '';

      h+=(p.remaining===EXPAND_COUNT[s.pendingAction]) ? btn('Back','back','class="ghost"') : (btn('Done','endexpand','class="ghost"')+btn('↺ Restart turn','redo','class="ghost"'));

/* ============================ 10. UI DISPATCH & MOVES ============================ */
let gameState=null;
function afterMutate(){ window.gameState=gameState; render(gameState); net.maybeBroadcast();
  if (gameState && gameState.phase==='payout' && !payoutTimer && (gameState.mode!=='online' || net.isHost)) runPayout();
  saveGame();
  maybeRunBot();
}
// Route a UI action string. In online guest mode, forward to host instead of applying.
function uiAction(cmd){
  if (!gameState) return;
  if (gameState.phase==='payout') return; // input locked while dividends are being paid out
  if (isBotSeat(gameState, gameState.currentPlayer)) return; // it's a bot's turn — humans can't act for it
  if (gameState.mode==='online' && !net.isHost){ net.requestMove(cmd); return; }
  applyUi(gameState, cmd); afterMutate();
}
// dividend payout animation — pays company-by-company (most expensive first) with a pause between each
let payoutTimer=null;
function runPayout(){ const s=gameState; if (!s || !s.payout){ return; }
  const iv = Math.min(1800, Math.max(450, Math.round(botSpeed*1.5))); // dividend pace follows the Bot speed setting (Fast/Normal/Slow)
  payoutTimer=setInterval(()=>{
    if (!gameState || !gameState.payout){ clearInterval(payoutTimer); payoutTimer=null; return; }
    const s=gameState; s.payout.idx++;
    if (s.payout.idx >= s.payout.steps.length){
      clearInterval(payoutTimer); payoutTimer=null; s.payout=null;
      endRound(s); window.gameState=s; render(s); net.maybeBroadcast(); saveGame();
      maybeRunBot(); // new round started — kick off the first player's turn if it's a bot (else the game hangs here)
      return;
    }
    applyDivStep(s, s.payout.steps[s.payout.idx]);
    window.gameState=s; render(s); net.maybeBroadcast();
  }, iv);
}
function applyUi(s, cmd){
  const [k,v]=cmd.split(':');
  if (k==='choose') chooseAction(s, v);
  else if (k==='decline') decline(s);
  else if (k==='back') goBack(s);
  else if (k==='fund') doFund5(s, v);
  else if (k==='take2') doTake2(s, v);
  else if (k==='take2expand'){ s.pendingAction='take2'; s.turnPhase='expanding'; s.pending={remaining:2, companyId:null}; }
  else if (k==='auc') selectAuctionCompany(s, v);
  else if (k==='exco') { if (v) selectExpandCompany(s, v); else s.pending.companyId=null; }
  else if (k==='endexpand') endExpand(s);
  else if (k==='bid') bid(s, parseInt(v,10));
  else if (k==='pass') passBid(s);
  else if (k==='done') doneTurn(s);
  else if (k==='redo') redoTurn(s);
  else if (k==='startok') confirmStartCube(s);
  else if (k==='startback') undoStartCube(s);
  else if (k==='hex') clickHex(s, v);
}
function clickHex(s, id){
  if (s.turnPhase==='placeStartCube') placeStartingCube(s, id);
  else if (s.turnPhase==='developing') doDevelop(s, id);
  else if (s.turnPhase==='expanding' && s.pending && s.pending.companyId) expandPlaceHex(s, id);
}

/* ---- your name: remembered between sessions, and live while you sit in the room ----
   The host's name used to be captured the instant they clicked "Host Online Game" — before the
   name box was even on screen — so anything typed afterwards was thrown away and they played the
   whole game as "Host". It now updates the roster as you type, and is remembered next time. */
const NAME_KEY='ar-name-v1';
function savedName(){ try{ return localStorage.getItem(NAME_KEY)||''; }catch(e){ return ''; } }
function rememberName(n){ try{ if (n) localStorage.setItem(NAME_KEY, n); }catch(e){} }
(function initNames(){
  const mine=savedName();
  const h=$('#host-name'), j=$('#join-name');
  if (h){ h.placeholder='Your name'; h.value = mine || '';

function genRoomCode(){ const cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for (let i=0;i<4;i++) c+=cs[Math.floor(Math.random()*cs.length)]; return c; }
// One room screen, drawn for whoever is looking at it. The host gets the bot buttons and the Start
// button; a guest gets the same room code and the same list of who is in, plus a live "waiting"
// line — so joining visibly puts you somewhere, instead of leaving you on a form you already used.
function renderRoom({names, bots, roomCode, mySeat, isHost}){
  $('#room-code').textContent = roomCode || '----';
  $('#room-code-label').textContent = isHost ? 'Room code — share with your friends' : 'Room code';
  document.querySelectorAll('.host-only').forEach(el=>el.classList.toggle('hidden', !isHost));
  $('#guest-wait').classList.toggle('hidden', isHost);
  $('#leave-room').classList.toggle('hidden', isHost);
  const seats = (names||[]).map((n,i)=>{
    const you = i===mySeat ? `<span class="seat-you"> (you${isHost?', host':''})</span>` : (i===0 && !isHost ? ' (host)' : '');
    const bot = bots && bots[i] ? ` · <span class="bot-diff bd-${bots[i]}">${botLabel(bots[i])}</span>` : '';
    return `${i+1}. ${n}${you}${bot}`;
  });
  $('#connected-players').innerHTML = seats.length ? seats.join('<br>')
    : (isHost ? 'Waiting for players…' : 'Joining the room…');
  if (!isHost){
    const n = (names||[]).length;
    $('#guest-wait-text').textContent = n && n<3
      ? `You're in. Waiting for more players — ${n} of at least 3 seats filled…`
      : `You're in. Waiting for the host to start the game…`;
  }
}
const net = {
  isHost:false, peer:null, conns:[], roomCode:null, seatOf:new Map(), lobbyNames:[], lobbyBots:[],
  startHost(){ if (typeof Peer==='undefined'){ alert('Online needs an internet connection (PeerJS failed to load).'); return; }
    this.isHost=true; this.roomCode=genRoomCode(); $('#host-view').classList.remove('hidden'); $('#player-config').classList.add('hidden'); $('#join-view').classList.add('hidden');
    $('#room-code').textContent=this.roomCode;
    this.lobbyNames=[$('#host-name').value.trim() || savedName() || 'Host']; this.lobbyBots=[null];
    this.peer=new Peer('amrails-'+this.roomCode);
    this.peer.on('error', err=>{ console.error(err); $('#connected-players').textContent='Error: '+err.type; });
    this.peer.on('connection', conn=>{ this.conns.push(conn);
      conn.on('data', d=>this._hostOnData(conn,d));
      conn.on('open', ()=>{});
      conn.on('close', ()=>{ this.conns=this.conns.filter(c=>c!==conn); this._onGuestClose(conn); });
    });
    this._renderHostLobby();
  },
  // the host renaming themselves while sitting in the room — the roster and every guest follow along
  setHostName(v){ if (!this.isHost || !this.lobbyNames.length) return;
    this.lobbyNames[0] = v.trim() || 'Host'; this._renderHostLobby(); },
  addBot(diff){ if (!this.isHost) return; const total=this.lobbyNames.length; if (total>=5) return;
    const names=['Ada','Boris','Cleo','Dex','Echo']; this.lobbyNames.push((names[total]||('Bot'+total))+' 🤖'); this.lobbyBots.push(diff); this._renderHostLobby(); },
  removeBot(){ if (!this.isHost) return;
    for (let k=this.lobbyBots.length-1;k>=0;k--){ if (this.lobbyBots[k]){ this.lobbyBots.splice(k,1); this.lobbyNames.splice(k,1); break; } } this._renderHostLobby(); },
  _hostOnData(conn,msg){
    if (msg.type==='join'){ conn.playerName=msg.playerName;
      // game already running → let a newcomer (or the same player) slot into a disconnected seat
      if (gameState && gameState.phase!=='lobby'){
        let seat = gameState.players.findIndex(p=>p.disconnected && p.name===msg.playerName);
        if (seat<0) seat = gameState.players.findIndex(p=>p.disconnected);
        if (seat>=0){ const p=gameState.players[seat]; p.disconnected=false; p.bot=p.botBackup||null; delete p.botBackup; p.name=msg.playerName; conn.seat=seat;
          conn.send({type:'welcome',seat,roomCode:this.roomCode}); conn.send({type:'gameStart',state:makeView(gameState,seat)});
          pushLog(gameState, `${msg.playerName} reconnected (seat ${seat+1}).`); afterMutate(); }
        else conn.send({type:'full'});
        return; }
      // lobby join
      if (this.lobbyNames.length<5){ conn.seat=this.lobbyNames.length; this.lobbyNames.push(msg.playerName); this.lobbyBots.push(null); conn.send({type:'welcome',seat:conn.seat,roomCode:this.roomCode}); this._renderHostLobby(); }
      else conn.send({type:'full'}); }
    else if (msg.type==='moveRequest'){ if (gameState && gameState.currentPlayer===msg.seat && gameState.phase!=='payout'){ applyUi(gameState, msg.cmd); afterMutate(); } }
  },
  _onGuestClose(conn){
    // dropped while still in the room: free the seat, renumber the seats behind them, and tell
    // everyone — otherwise a ghost seat sits in the list and counts toward the 3-player minimum
    if (conn.seat!=null && (!gameState || gameState.phase==='lobby')){
      if (conn.seat>0 && conn.seat<this.lobbyNames.length){
        this.lobbyNames.splice(conn.seat,1); this.lobbyBots.splice(conn.seat,1);
        for (const c of this.conns) if (c.seat!=null && c.seat>conn.seat) c.seat--;
        conn.seat=null; this._renderHostLobby();
      }
      return;
    }
    // a human dropped mid-game: keep their seat playing with a fill bot; they (or a friend) can rejoin into it
    if (conn.seat==null || !gameState || gameState.phase==='lobby' || gameState.phase==='gameOver') return;
    const p=gameState.players[conn.seat]; if (!p || p.disconnected) return;
    p.disconnected=true; p.botBackup = (p.bot||null); p.bot = p.bot || 'medium';
    pushLog(gameState, `${p.name} disconnected — a bot is filling in (they can rejoin with the room code).`);
    afterMutate(); },
  _renderHostLobby(){ renderRoom({names:this.lobbyNames, bots:this.lobbyBots, roomCode:this.roomCode, mySeat:0, isHost:true});
    $('#start-online').disabled = this.lobbyNames.length<3;
    this._broadcastLobby(); },
  // keep every guest's roster live — someone joining, or a bot being added, shows up on their screen too
  _broadcastLobby(){ for (const conn of this.conns){ if (conn.seat!=null)
    conn.send({type:'lobby', names:this.lobbyNames, bots:this.lobbyBots, roomCode:this.roomCode, yourSeat:conn.seat}); } },
  hostStartGame(){ gameState=createInitialState({mode:'online',names:this.lobbyNames.slice(),bots:this.lobbyBots.slice()}); gameState.localPlayerId=0; window.gameState=gameState;
    this._broadcastState(true); show('game'); render(gameState); maybeRunBot(); },
  _broadcastState(start){ for (const conn of this.conns){ if (conn.seat!=null){ const view=makeView(gameState, conn.seat); conn.send({type: start?'gameStart':'stateUpdate', state:view}); } } },
  maybeBroadcast(){ if (this.isHost && gameState && gameState.mode==='online') this._broadcastState(); },
  requestMove(cmd){ if (this.hostConn) this.hostConn.send({type:'moveRequest', seat:this.mySeat, cmd}); },
  joinGame(name, code){ if (typeof Peer==='undefined'){ alert('Online needs an internet connection.'); return; }
    if (!code){ $('#join-status').textContent='Enter a room code.'; return; }
    this.isHost=false; $('#join-status').textContent='Connecting…';
    this.peer=new Peer(); this.peer.on('error', err=>{ $('#join-status').textContent='Error: '+err.type; });
    this.peer.on('open', ()=>{ const conn=this.peer.connect('amrails-'+code,{reliable:true}); this.hostConn=conn;
      conn.on('open', ()=>{ conn.send({type:'join',playerName:name}); });
      conn.on('data', d=>this._guestOnData(d));
      // say it wherever they're actually looking — the room screen if they got in, else the join form
      conn.on('close', ()=>{ $('#join-status').textContent='Disconnected from host.';
        const w=$('#guest-wait-text'); if (w) w.textContent='Lost the connection to the host. Leave the room and rejoin with the code.';
        const d=document.querySelector('.waiting-dot'); if (d) d.style.background='var(--color-error)'; });
    });
  },
  _guestOnData(msg){
    if (msg.type==='welcome'){ this.mySeat=msg.seat; this.roomCode=msg.roomCode;
      $('#join-status').textContent='';
      // you're in — swap the join form for the room itself, so it's obvious you're waiting, not stuck
      $('#join-view').classList.add('hidden'); $('#host-view').classList.remove('hidden');
      renderRoom({names:[], bots:[], roomCode:msg.roomCode, mySeat:msg.seat, isHost:false}); }
    else if (msg.type==='lobby'){ this.lobbyNames=msg.names.slice(); this.lobbyBots=msg.bots.slice();
      if (msg.yourSeat!=null) this.mySeat=msg.yourSeat;          // seats renumber if someone ahead of you leaves
      renderRoom({names:msg.names, bots:msg.bots, roomCode:msg.roomCode||this.roomCode, mySeat:this.mySeat, isHost:false}); }
    else if (msg.type==='full'){ $('#join-status').textContent='Room is full.'; }
    else if (msg.type==='gameStart' || msg.type==='stateUpdate'){ gameState=msg.state; gameState.localPlayerId=this.mySeat; window.gameState=gameState; show('game'); render(gameState); }
  },
  // a guest backing out of the room (wrong code, changed their mind) returns to the front screen
  leaveRoom(){ this.leave(); this.mySeat=null; this.lobbyNames=[]; this.lobbyBots=[];
    $('#host-view').classList.add('hidden'); $('#join-view').classList.add('hidden'); $('#player-config').classList.add('hidden');
    $('#join-status').textContent=''; },
  leave(){ try{ if (this.peer) this.peer.destroy(); }catch(e){} this.peer=null; this.conns=[]; this.isHost=false; this.hostConn=null; },
};
// In online mode, guests receive a view; host has full state. For this game there is no
// hidden info, so the "view" is essentially the full state (money/shares are public).
function makeView(s, seat){ const v=JSON.parse(JSON.stringify(s)); v.localPlayerId=seat;
  v.startCubeUndo=null;   // the host's undo buffer is a whole serialised state — no need to ship it
  return v; }

/* ---- save / resume: local games auto-save so an accidental refresh doesn't lose the night ---- */
const SAVE_KEY='ar-save-v1';
function saveGame(){ try{
  if(!gameState || gameState.mode!=='local') return;                 // online is host-authoritative; use rejoin instead
  if(gameState.phase==='lobby'||gameState.phase==='payout') return;   // payout is a transient animation — skip
  if(gameState.phase==='gameOver'){ localStorage.removeItem(SAVE_KEY); return; }
  localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));
}catch(e){} }
function hasSave(){ try{ const j=localStorage.getItem(SAVE_KEY); if(!j) return null; const st=JSON.parse(j); return (st&&st.phase&&st.phase!=='gameOver'&&st.phase!=='lobby')?st:null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function resumeGame(){ const st=hasSave(); if(!st) return false; gameState=st; window.gameState=gameState; show('game'); render(gameState); maybeRunBot(); return true; }
function refreshResumeBtn(){ const b=$('#resume-btn'); if(b) b.style.display = hasSave()?'':'none'; }

/* ---- "Copy game report": one click, so a game can be pasted to someone who wasn't watching ----
   Chrome now hides console pasting behind a scary warning, which is no way to ask anyone to export
   anything. This writes a readable account of the game to the clipboard instead. */
function gameReport(s){
  if (!s) return 'No game in progress.';
  const L=[];
  L.push('AMERICAN RAILS — game report');
  L.push(`year ${s.year} · round ${s.round} · phase ${s.phase}/${s.turnPhase} · seed ${s.seed}`);
  L.push('');
  L.push('PLAYERS');
  const places = s.phase==='gameOver' ? finalPlaces(s) : null;
  s.players.forEach((p,i)=>{
    const groups={}; p.shares.forEach(x=>groups[x]=(groups[x]||0)+1);
    const held = Object.entries(groups).map(([c,n])=>`${COMPANIES[c].name}${n>1?' x'+n:''}`).join(', ') || 'none';
    L.push(`  ${i+1}. ${p.name} — $${p.money} · shares: ${held}`
      + (p.bot ? ` · BOT ${botLabel(p.bot)}` : ' · human')
      + (places ? ` · finished ${places[i]}` : ''));
  });
  L.push('');
  L.push('COMPANIES');
  for (const id of COMPANY_IDS){ const c=s.companies[id];
    L.push(`  ${COMPANIES[id].name}: income ${c.income} · treasury $${c.treasury} · ${c.cubesInSupply} cubes left`
      + ` · ${c.sharesInSupply}/${COMPANIES[id].shares} shares unsold${c.removed?' · REMOVED':''}`); }
  L.push('');
  // Spoiler block: how each bot was set up. Kept at the bottom and labelled, since personalities are
  // deliberately hidden during play — it is here so a game can be diagnosed after the fact.
  L.push('BOT INTERNALS (spoilers — skip if you are still playing this game)');
  s.players.forEach((p,i)=>{ if(!p.bot) return;
    const per=BOT_PERSONAS[p.persona]||{};
    let plan='n/a'; try{ plan=prepPlan(s,i,p.bot); }catch(e){}
    L.push(`  ${p.name}: tier ${p.bot} (shown as ${botLabel(p.bot)}) · persona ${per.label||p.persona} · opening plan ${plan}`); });
  L.push('');
  L.push(`LOG (last ${s.log.length} entries)`);
  s.log.forEach(l=>L.push('  '+l));
  return L.join('\n');
}
function copyGameReport(){
  const txt = gameReport(gameState);
  const done = ok => { const b=$('#copy-log-btn'); if(!b) return;
    b.textContent = ok ? '✓ Copied — paste it anywhere' : '⚠ Could not copy';
    setTimeout(()=>{ b.textContent='📋 Copy game report'; }, 2600); };
  // the async clipboard API needs a secure context; fall back to the old selection trick otherwise
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(()=>done(true), ()=>done(fallbackCopy(txt)));
  } else done(fallbackCopy(txt));
}
function fallbackCopy(txt){ try{
  const ta=document.createElement('textarea'); ta.value=txt;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
  ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok;
}catch(e){ return false; } }

/* ============================ 13. TEST API ============================ */
window.startGame = function(config){ gameState=createInitialState(config); window.gameState=gameState; show('game'); render(gameState); maybeRunBot(); return true; };
window.performMove = function(cmd){ if (!gameState) return {ok:false}; applyUi(gameState, cmd); afterMutate(); return {ok:true, state: JSON.parse(window.render_game_to_text())}; };
// Built-in self-test: drives full games headlessly and checks invariants.
window.__selfTest = function(){
  const _prevAnim=ANIM; ANIM=false; // resolve dividends/end synchronously for the test
  const results=[]; const assert=(name,cond)=>results.push({name,pass:!!cond});
  const cityIds=['2,1','16,3','6,12','1,6','18,1','11,0','0,17','8,15','10,3','6,5','3,9','4,14','11,9','6,1'];
  function st(){ return JSON.parse(window.render_game_to_text()); }
  function driveSetup(s){ let g=0; while(s.phase==='setup'&&g++<200){ if(s.turnPhase==='bidding'){ (s.auction.bid===0 && s.players[s.currentPlayer].money>=10)?applyUi(gameState,'bid:10'):applyUi(gameState,'pass'); } else if(s.turnPhase==='confirmStartCube'){ applyUi(gameState,'startok'); } else { const occ=Object.keys(st().cubesOnBoard||{}); applyUi(gameState,'hex:'+cityIds.find(c=>!occ.includes(c))); } s=st(); } return s; }
  function playToEnd(s){ let g=0; while(s.phase!=='gameOver'&&g++<4000){ const tp=s.turnPhase;
    if(tp==='bidding'){ (s.auction.bid===0 && s.players[s.currentPlayer].money>=10) ? applyUi(gameState,'bid:10') : applyUi(gameState,'pass'); }
    else if(tp==='placeStartCube'){ const occ=Object.keys(st().cubesOnBoard||{}); applyUi(gameState,'hex:'+cityIds.find(c=>!occ.includes(c))); }
    else if(tp==='confirmStartCube'){ applyUi(gameState,'startok'); }
    else if(tp==='chooseAction'){ applyUi(gameState,'choose:'+s.availableRows[0]); }
    else if(tp==='take2choice'){ applyUi(gameState,'take2:take'); }
    else if(tp==='funding'){ applyUi(gameState,'fund:'+activeCompanyIds(gameState)[0]); }
    else if(tp==='expanding'){ applyUi(gameState,'endexpand'); }
    else if(tp==='turnDone'){ applyUi(gameState,'done'); }
    else applyUi(gameState,'decline'); s=st(); } return s; }
  // 4-player full game
  window.startGame({mode:'local',names:['A','B','C','D']}); let s=driveSetup(st());
  assert('4p: setup reaches action phase', s.phase==='action');
  assert('4p: all non-removed companies on map', Object.values(s.companies).filter(c=>!c.removed).every(c=>c.onMap));
  assert('4p: opening turn order follows prep-auction win order', gameState.setupWinOrder.length>0 && gameState.turnOrder.slice(0,gameState.setupWinOrder.length).every((seat,i)=>seat===gameState.setupWinOrder[i]));
  s=playToEnd(s);
  assert('4p: game ends at 1857', s.phase==='gameOver' && s.year===1857);
  assert('4p: has a winner', (s.winner||[]).length>=1);
  // 3-player removes one company
  window.startGame({mode:'local',names:['A','B','C'],removed:'liberty'}); s=st();
  assert('3p: one company removed', Object.values(s.companies).filter(c=>c.removed).length===1);
  // illegal bid rejected
  window.startGame({mode:'local',names:['A','B','C']}); s=st();
  const before=st().auction.bid; bid(gameState,5); assert('illegal $5 bid rejected (min $10)', st().auction.bid===before);
  bid(gameState,10); assert('valid $10 bid accepted', st().auction.bid===10);

  /* ---- money-math unit checks on controlled mini-states ---- */
  function miniState(){ return { players:[{money:50,shares:[]},{money:50,shares:[]},{money:50,shares:[]}],
    companies:Object.fromEntries(COMPANY_IDS.map(id=>[id,{treasury:0,income:0,sharesInSupply:COMPANIES[id].shares,sharesRemoved:0,cubesInSupply:COMPANIES[id].cubes,onMap:false,bonuses:[],removed:false}])),
    hexes:{}, developmentSupply:12, year:1854, log:[] }; }
  const H=Object.keys(BOARD).find(id=>{const c=BOARD[id].city; return c && c.developable && c.full>c.shared;});
  const CF=BOARD[H].city.full, CS=BOARD[H].city.shared;
  // shared-city income: 1st gets full, 2nd demotes incumbent to shared, 3rd+ just gets shared
  let m=miniState();
  m.hexes[H]={cubes:['american'],developed:false}; applyCityEntry(m,H,'american');
  assert('city: 1st entrant gets full', m.companies.american.income===CF);
  m.hexes[H].cubes.push('national'); applyCityEntry(m,H,'national');
  assert('city: 2nd entrant gets shared', m.companies.national.income===CS);
  assert('city: incumbent demoted to shared', m.companies.american.income===CS);
  m.hexes[H].cubes.push('continental'); applyCityEntry(m,H,'continental');
  assert('city: 3rd entrant gets shared', m.companies.continental.income===CS);
  assert('city: incumbents unchanged on 3rd', m.companies.american.income===CS && m.companies.national.income===CS);
  // developed-city interaction: +2 solo, then demote to shared+1 each when a 2nd enters
  let m2=miniState(); m2.hexes[H]={cubes:['american'],developed:false}; applyCityEntry(m2,H,'american');
  m2.hexes[H].developed=true; applyDevelopment(m2,H);
  assert('develop: solo company +2', m2.companies.american.income===CF+2);
  m2.hexes[H].cubes.push('national'); applyCityEntry(m2,H,'national');
  assert('develop: incumbent -> shared+1 when shared', m2.companies.american.income===CS+1);
  assert('develop: newcomer gets shared+1', m2.companies.national.income===CS+1);
  // dividends: ceil(income/held) per share
  let m3=miniState(); m3.companies.american.income=7; m3.players[0].shares=['american','american']; m3.players[1].shares=['american'];
  const st0=computeDividends(m3).find(x=>x.company==='american');
  assert('dividend per-share = ceil(income/held)', !!st0 && st0.per===3 && st0.held===3);
  applyDivStep(m3, st0);
  assert('dividend pays per*count', m3.players[0].money===56 && m3.players[1].money===53);
  // special connections: +$10 per pair, once each, idempotent
  let m4=miniState(); for(const id in BOARD) m4.hexes[id]={cubes:['american'],developed:false};
  applySpecialConnections(m4,'american');
  assert('all 3 special connections = +30 income', m4.companies.american.income===30);
  assert('each bonus recorded once', m4.companies.american.bonuses.length===3);
  applySpecialConnections(m4,'american');
  assert('connection bonus not double-counted', m4.companies.american.income===30);
  // expand cost: $2 + $2/cube; forest $3, mountain $5; developed city adds NO surcharge (house rule)
  let m5=miniState();
  const plains=Object.keys(BOARD).find(id=>BOARD[id].terrain==='plains');
  m5.hexes[plains]={cubes:[],developed:false}; assert('cost: empty plains $2', expandCost(m5,plains)===2);
  m5.hexes[plains].cubes=['american']; assert('cost: plains w/1 cube $4', expandCost(m5,plains)===4);
  m5.hexes[H]={cubes:['american'],developed:true}; assert('cost: developed city no surcharge', expandCost(m5,H)===4);
  assert('cost: forest flat $3', expandCost(m5,Object.keys(BOARD).find(id=>BOARD[id].terrain==='forest'))===3);
  assert('cost: mountain flat $5', expandCost(m5,Object.keys(BOARD).find(id=>BOARD[id].terrain==='mountain'))===5);
  // take $2 from each: taker +2*(n-1), others -2
  let m6=miniState(); m6.turnPhase='take2choice'; m6.currentPlayer=0; doTake2(m6,'fromEach');
  assert('take2 fromEach: actor gains nothing (money goes to bank)', m6.players[0].money===50);
  assert('take2 fromEach: each other player pays $2 to bank', m6.players[1].money===48 && m6.players[2].money===48);
  let m6b=miniState(); m6b.turnPhase='take2choice'; m6b.currentPlayer=0; doTake2(m6b,'take');
  assert('take2 take: actor +2 from bank', m6b.players[0].money===52 && m6b.players[1].money===50);

  /* ---- bot valuation & auction behaviour ---- */
  // the end of the game is not just the year track — draining the cube piles ends it sooner
  let m7=miniState(); m7.year=1851;
  assert('horizon: a fresh 1851 game has a long horizon', horizonRounds(m7)>5);
  for(const id of COMPANY_IDS){ m7.companies[id].onMap=true; m7.companies[id].cubesInSupply=1; }
  assert('horizon: collapses when the cube piles run dry', horizonRounds(m7)<=1.01);
  // scarce shares are worth more: the same income split two ways beats five ways
  let m9=miniState(); m9.year=1851;
  assert('valuation: a scarce share beats a crowded one',
    shareWorth(m9,0,'liberty',0,'hard').contested > shareWorth(m9,0,'american',0,'hard').contested*1.1);
  // the printed share count has to drive the price, not just tip it — a fifth of a railroad is
  // worth far less than a half of one, and these used to come out identical
  { const dil=id=>expectedDilution(m9,id,'extreme');
    assert('valuation: dilution scales with the shares actually printed',
      dil('american') > dil('national') && dil('national') > dil('continental') && dil('continental') > dil('liberty'));
    const w=id=>shareWorth(m9,0,id,0,'extreme').contested;
    assert('valuation: a 2-share company is worth well over a 5-share one', w('liberty') > w('american')*1.6);
    assert('valuation: 3-share beats 5-share', w('continental') > w('american')*1.15); }
  // in the prep round every company is auctioned in turn, so a share competes with the ones still to come
  { const m=miniState(); m.year=1851; m.turnPhase='bidding'; m.currentPlayer=0; m.players.forEach(p=>{p.persona='baron';});
    const openCap=(cid,queue)=>{ m.setupQueue=queue.slice();
      m.auction={companyId:cid,isSetup:true,bid:0,highBidder:null,active:[0,1,2],cur:0};
      return botBidCap(m,0,'extreme'); };
    assert('prep: a bot pays less when a better railroad is still to be auctioned',
      openCap('american',['liberty','republic']) < openCap('american',[])); }
  // budgeting across the whole round: the scarce-share companies are auctioned LAST, so a bot that
  // has already bought must not throttle itself out of the best lot left
  { const m=miniState(); m.year=1851; m.turnPhase='bidding'; m.currentPlayer=0;
    m.players.forEach(p=>{p.persona='baron';}); m.players[0].shares=['american'];
    const capFor=(cid,queue)=>{ m.setupQueue=queue.slice();
      m.auction={companyId:cid,isSetup:true,bid:0,highBidder:null,active:[0,1,2],cur:0};
      return botBidCap(m,0,'extreme'); };
    // liberty last, nothing better to come: a bot holding a share should still bid properly for it
    const lastLot = capFor('liberty', []);
    const earlyLot = capFor('majestic', ['liberty']);      // something better still queued
    assert('prep: the best remaining lot is not throttled by already owning a share', lastLot > earlyLot);
    // (no head-to-head cap assertion here: with a full purse both lots are capped by cash rather than
    // worth, so the ceilings are equal by design. The value difference is asserted on shareWorth above.)
  }
  // a 2nd share of a company you already own alone pays you nothing extra — only denial is worth paying for
  let m10=miniState(); m10.companies.liberty.onMap=true; m10.companies.liberty.income=12;
  m10.companies.liberty.sharesInSupply=1; m10.players[0].shares=['liberty'];
  const w10=shareWorth(m10,0,'liberty',0,'hard');
  assert('valuation: 2nd share of a wholly-owned company adds ~nothing', w10.solo < w10.contested*0.4);
  // late game: a share that only pays one dividend is not worth an early-game price
  function capAt(year, income){ const m=miniState(); m.year=year; m.turnPhase='bidding'; m.currentPlayer=0; m.round=1;
    m.players.forEach(p=>{p.persona='baron';}); m.companies.american.onMap=true; m.companies.american.income=income;
    m.auction={companyId:'american',isSetup:false,bid:0,highBidder:null,active:[0,1,2],cur:0}; return botBidCap(m,0,'hard'); }
  assert('bots bid far less for a share in the final year', capAt(1857,10) < capAt(1851,10)*0.5);
  assert('final-year share is below the $10 minimum — bot passes', capAt(1857,6) < 10);

  /* ---- bot strategy: expansion, connections, endgame control ---- */
  function expState(mine, theirs){
    const m=miniState(); m.year=1852; m.turnPhase='chooseAction'; m.currentPlayer=0;
    const start=cityHexByName('Cleveland');
    m.hexes[start]={cubes:['american'],developed:false};
    const co=m.companies.american; co.onMap=true; co.income=4; co.treasury=20;
    m.players[0].shares=mine.slice(); m.players[1].shares=theirs.slice(); return m; }
  const soloOwned = bestExpansion(expState(['american'],[]),0,'american',4,'hard').value;
  const rivalHeavy = bestExpansion(expState(['american'],['american','american']),0,'american',4,'hard').value;
  assert('expansion: growing a company rivals dominate is worth less to me', rivalHeavy < soloOwned*0.6);
  assert('expansion: a wholly-owned company is worth expanding', soloOwned>0);
  // reach matters: 4 cubes get further than 2, so the row is not worth the same
  const far4 = bestExpansion(expState(['american'],[]),0,'american',4,'hard').value;
  const far2 = bestExpansion(expState(['american'],[]),0,'american',2,'hard').value;
  assert('expansion: Expand 4 is worth at least as much as Expand 2', far4>=far2);
  // special connections: +$10 when the far end is already on the company's network
  { const m=miniState(); m.year=1853; const ny=cityHexByName('New York');
    assert('connection: completing a pair is worth +$10',
      connectionGain(m,'american',ny,new Set(['Chicago']),'hard') >= 10);
    assert('connection: reaching the first special city still carries option value',
      connectionGain(m,'american',ny,new Set(['Cleveland']),'hard') > 0); }
  // developing pays my slice of +$2, not the whole city
  { const m=miniState(); const h=cityHexByName('Cleveland'); m.year=1853;
    m.hexes[h]={cubes:['american'],developed:false}; m.players[0].shares=['american'];
    const solo=developGain(m,0,h,'hard');
    m.players[1].shares=['american','american'];
    assert('develop: worth less when rivals hold most of the company', developGain(m,0,h,'hard') < solo*0.6); }
  // endgame control: near the end a leader wants it over, a trailer does not
  { const m=miniState(); m.year=1856; m.players[0].money=90; m.players[1].money=40; m.players[2].money=40;
    for(const id of COMPANY_IDS){ m.companies[id].onMap=true; m.companies[id].cubesInSupply=3; }
    assert('endgame: the leader pushes to finish', endgameTilt(m,0,'hard')===1);
    assert('endgame: a trailing bot stops helping the clock', endgameTilt(m,1,'hard')===-1);
    const early=miniState(); early.year=1851; early.players[0].money=90;
    assert('endgame: no tilt while there is still time', endgameTilt(early,0,'hard')===0);
    assert('endgame: medium bots do not play the clock', endgameTilt(m,0,'medium')===0); }

  /* ---- podium: gold / silver / bronze ---- */
  { const mk=moneys=>({players:moneys.map((m,i)=>({id:i,money:m}))});
    let pl=finalPlaces(mk([300,220,150,90]));
    assert('podium: places run 1-2-3-4 by money', pl[0]===1&&pl[1]===2&&pl[2]===3&&pl[3]===4);
    assert('podium: only the top three get a trophy',
      !!PLACE_METAL[pl[0]] && !!PLACE_METAL[pl[1]] && !!PLACE_METAL[pl[2]] && !PLACE_METAL[pl[3]]);
    pl=finalPlaces(mk([300,300,150,90]));
    assert('podium: a tie for 1st gives two golds and no silver', pl[0]===1&&pl[1]===1&&pl[2]===3&&pl[3]===4);
    pl=finalPlaces(mk([300,220,220,90]));
    assert('podium: a tie for 2nd gives two silvers and no bronze', pl[1]===2&&pl[2]===2&&pl[3]===4);
    assert('podium: seat order does not decide places', finalPlaces(mk([90,300,220]))[1]===1);
    assert('podium: three metals are defined', ['gold','silver','bronze'].every(m=>TROPHY_METAL[m]&&TROPHY_METAL[m].length===3));
    assert('podium: trophies render as svg', /^<svg[\s\S]*<\/svg>$/.test(trophySVG('silver')) && trophySVG('bronze').includes('#bd7a45')); }

  /* ---- personalities: visible from the first bid, and off-model on purpose ---- */
  { const plans={};
    for (let seed=1; seed<=60; seed++){
      const m=miniState(); m.seed=seed*7919;
      m.players.forEach((p,i)=>{ p.bot='extreme'; p.persona=PERSONA_IDS[(i+seed)%PERSONA_IDS.length]; });
      m.players.forEach((p,i)=>{ const k=p.persona+':'+prepPlan(m,i,'extreme'); plans[k]=(plans[k]||0)+1; }); }
    const any=(pre)=>Object.keys(plans).some(k=>k.startsWith(pre));
    assert('personas: a Banker sometimes sits the opening out', any('banker:hoard'));
    assert('personas: a Banker also plays it straight sometimes', any('banker:normal'));
    assert('personas: a Tycoon never hoards', !any('tycoon:hoard'));
    assert('personas: a Tycoon does commit all-in', any('tycoon:allin'));
    assert('personas: every plan is one of the three',
      Object.keys(plans).every(k=>/:(hoard|allin|normal)$/.test(k))); }
  // the plan has to change what it actually bids, not just be recorded
  { const m=miniState(); m.year=1851; m.turnPhase='bidding'; m.currentPlayer=0; m.setupQueue=['liberty','republic'];
    m.auction={companyId:'american',isSetup:true,bid:0,highBidder:null,active:[0,1,2],cur:0};
    const capWith=persona=>{ m.players[0].persona=persona; return botBidCap(m,0,'extreme'); };
    m.seed=1; const banker=capWith('banker'), tycoon=capWith('tycoon');
    assert('personas: a Tycoon opens above a Banker', tycoon > banker);
    assert('personas: even a hoarding bot will take a bargain', banker >= 0); }
  // above Hard the personality is pulled toward the tuned centre, never erased
  { const m=miniState(); m.turnPhase='bidding'; m.currentPlayer=0; m.year=1853;
    m.auction={companyId:'american',isSetup:false,bid:0,highBidder:null,active:[0,1,2],cur:0};
    m.players[0].persona='banker'; const exB=bidStyle(m,0,'extreme');
    m.players[0].persona='tycoon'; const exT=bidStyle(m,0,'extreme');
    assert('personas: Extreme keeps them distinguishable', exT.aggr > exB.aggr && exT.spend > exB.spend);
    assert('personas: Extreme still lifts the timid ones toward ruthless', exB.spend > BOT_PERSONAS.banker.spend); }

  /* ---- tier labels: shown one step down from the internal keys ---- */
  assert('labels: the ladder reads Training / Easy / Medium / Hard',
    botLabel('easy')==='Training' && botLabel('medium')==='Easy' && botLabel('hard')==='Medium' && botLabel('extreme')==='Hard');
  assert('labels: internal keys are untouched, so saves and online messages still work',
    ['easy','medium','hard','extreme'].every(k=>BOT_TIER[k]!=null) && hardPlus('extreme') && !hardPlus('medium'));
  // cube slots: every cube gets its own spot, and none drops onto the rail-tie signal at y+31
  for (let n=1;n<=6;n++){ const sl=hexCubeSlots(n,false);
    assert('cubes: '+n+' cube(s) get '+n+' distinct slots', sl.length===n);
    let minSep=Infinity;
    for (let i=0;i<n;i++) for (let j=i+1;j<n;j++)
      minSep=Math.min(minSep, Math.hypot(sl[i].dx-sl[j].dx, sl[i].dy-sl[j].dy));
    assert('cubes: '+n+' cube(s) never sit on top of each other', n===1 || minSep>=12);
    assert('cubes: '+n+' cube(s) stay clear of the rail-tie signal', sl.every(p=>p.dy+HEX*0.24 < 26));
    assert('cubes: '+n+' cube(s) stay inside the hex', sl.every(p=>Math.abs(p.dx)+9 <= HEX*0.87));
  }

  /* ---- start cube: confirm / back ---- */
  { window.startGame({mode:'local',names:['A','B','C'],removed:'liberty'});
    bid(gameState,10); passBid(gameState); passBid(gameState);       // A wins the first share
    const winner=gameState.currentPlayer, paid=gameState.players[winner].money, shares=gameState.players[winner].shares.length;
    assert('start cube: winner is asked to place', gameState.turnPhase==='placeStartCube');
    const cid=gameState.pendingStartCube.companyId;
    const chicago=cityHexByName('Chicago');
    applyUi(gameState,'hex:'+chicago);
    assert('start cube: placing asks to confirm rather than locking it in', gameState.turnPhase==='confirmStartCube');
    assert('start cube: the cube is on the board while you decide', (gameState.hexes[chicago]||{cubes:[]}).cubes.includes(cid));
    assert('start cube: income previewed on the company', gameState.companies[cid].income===BOARD[chicago].city.full);
    // Back puts the board back exactly as it was — but must NOT undo the auction itself
    applyUi(gameState,'startback');
    assert('start cube Back: returns to placing', gameState.turnPhase==='placeStartCube');
    assert('start cube Back: cube removed from the map', !(gameState.hexes[chicago]&&gameState.hexes[chicago].cubes.length));
    assert('start cube Back: company off the map again', gameState.companies[cid].onMap===false && gameState.companies[cid].income===0);
    assert('start cube Back: cube returned to supply', gameState.companies[cid].cubesInSupply===COMPANIES[cid].cubes);
    assert('start cube Back: the share and the money paid are NOT refunded',
      gameState.players[winner].money===paid && gameState.players[winner].shares.length===shares+0);
    assert('start cube Back: nothing logged about a start that never happened',
      !gameState.log.some(l=>/starts at Chicago/.test(l)));
    // now place somewhere else and confirm
    const stlouis=cityHexByName('St. Louis');
    applyUi(gameState,'hex:'+stlouis); applyUi(gameState,'startok');
    assert('start cube Confirm: company is on the map at the second choice',
      gameState.companies[cid].onMap===true && gameState.hexes[stlouis].cubes.includes(cid));
    assert('start cube Confirm: income set from that city', gameState.companies[cid].income===BOARD[stlouis].city.full);
    assert('start cube Confirm: the auction moves on', gameState.turnPhase!=='confirmStartCube'); }

  /* ---- Extreme tier ---- */
  { const m=miniState(); m.year=1853; m.turnPhase='bidding'; m.currentPlayer=0; m.round=2;
    m.companies.american.onMap=true; m.companies.american.income=12; m.companies.american.treasury=6;
    m.players.forEach(p=>{p.persona='banker';});                       // the tamest persona on the roster
    m.auction={companyId:'american',isSetup:false,bid:0,highBidder:null,active:[0,1,2],cur:0};
    assert('tiers: Extreme inherits everything Hard has', hardPlus('extreme') && isExtreme('extreme') && !isExtreme('hard'));
    // a Banker Extreme must not bid like a Banker — persona is style only above Hard
    assert('Extreme: a timid persona does not lower its ceiling',
      botBidCap(m,0,'extreme') > botBidCap(m,0,'hard'));
    // sniping: it creeps by the minimum instead of jumping, so it never overshoots the runner-up
    m.auction.bid=14; m.auction.highBidder=1;
    const exBid=botBid(m,0,'extreme');
    assert('Extreme: raises by the minimum (sniping)', exBid==='pass' || exBid==='bid:15');
    // and it still walks away — the valuation binds, so it cannot be baited into a bad buy
    m.auction.bid=400; m.auction.highBidder=1;
    assert('Extreme: refuses a price above what the share is worth', botBid(m,0,'extreme')==='pass'); }
  // it judges who is winning by projected finish, not by cash on the table
  { const m=miniState(); m.year=1853;
    m.companies.american.onMap=true; m.companies.american.income=30; m.companies.american.treasury=10;
    m.players[1].money=40; m.players[1].shares=['american'];           // poor now, but owns a monster
    m.players[2].money=95; m.players[2].shares=[];                     // rich now, owns nothing
    assert('Extreme: projected finish beats a fat wallet', projectedFinal(m,1,'extreme') > projectedFinal(m,2,'extreme'));
    assert('Extreme: aims at the seat that is really winning', targetSeat(m,0,'extreme')===1);
    assert('Hard: still simply watches the cash leader', targetSeat(m,0,'hard')===2); }
  // routing in dollars: a mountain crossing must cost more than open plains
  { const m=miniState(); const start=cityHexByName('Cleveland');
    m.hexes[start]={cubes:['american'],developed:false};
    const cost=cheapestRoute(m,[start]);
    const mtn=Object.keys(BOARD).find(id=>BOARD[id].terrain==='mountain' && cost[id]!==undefined);
    const plainsSameHops=(function(){ const hops=bfsHex([start]);
      return Object.keys(BOARD).find(id=>BOARD[id].terrain==='plains' && hops[id]===hops[mtn]); })();
    assert('Extreme: routing prices mountains above plains', !plainsSameHops || cost[mtn] > cost[plainsSameHops]); }

  // a full game driven entirely by the bots' own brains (catches crashes in every AI path)
  function playBots(seed, diffs){
    window.startGame({mode:'local',names:['A','B','C','D'],bots:diffs,seed});
    let g=0; const prices={};
    while (gameState.phase!=='gameOver' && g++<8000){
      if (gameState.phase==='setup' && gameState.turnPhase==='bidding'){ /* watch prep prices */ }
      let cmd=null; try{ cmd=botDecide(gameState); }catch(e){ cmd=null; }
      if(!cmd) cmd=botFallback(gameState);
      if(!cmd) break;
      const wasSetup = gameState.phase==='setup';
      applyUi(gameState, cmd);
      if (wasSetup && gameState.phase!=='setup'){ COMPANY_IDS.forEach(id=>{ if(!gameState.companies[id].removed) prices[id]=gameState.companies[id].treasury; }); }
    }
    return { s:gameState, prices, steps:g };
  }
  const bg = playBots(4242, ['hard','hard','medium','easy']);
  assert('bot game: reaches game over', bg.s.phase==='gameOver');
  assert('bot game: no player ends with negative money', bg.s.players.every(p=>p.money>=0));
  assert('bot game: every prep share was contested or removed', Object.keys(bg.prices).length>=5);
  const paid = Object.values(bg.prices).filter(v=>v>0);
  assert('prep auction: winning bids differ between companies', new Set(paid).size>=3);
  assert('prep auction: at least one share went above the $10 minimum', paid.some(v=>v>10));
  // bots do not all march to the same number any more
  assert('prep auction: price spread is meaningful', (Math.max(...paid)-Math.min(...paid))>=4);
  const bg2 = playBots(99, ['hard','medium','hard','medium']);
  assert('bot game (2nd seed): reaches game over', bg2.s.phase==='gameOver');
  const paid2 = Object.values(bg2.prices).filter(v=>v>0);
  assert('different seeds give different auction prices', JSON.stringify(paid)!==JSON.stringify(paid2));

  render(gameState);
  const passed=results.filter(r=>r.pass).length;
  ANIM=_prevAnim;
  return { passed, total:results.length, results };
};
window.render_game_to_text = function(){ if (!gameState) return JSON.stringify({phase:'lobby'});
  const s=gameState;
  return JSON.stringify({
    phase:s.phase, mode:s.mode, year:s.year, round:s.round, actionPhase:s.actionPhase,
    turnPhase:s.turnPhase, currentPlayer:s.currentPlayer,
    auction: s.auction? { company:s.auction.companyId, bid:s.auction.bid, high:s.auction.highBidder, active:s.auction.active }:null,
    pendingStartCube: s.pendingStartCube||null,
    startCubeHex: s.startCubeHex||null,
    pending: s.pending||null,
    availableRows: s.turnPhase==='chooseAction'?availableActionRows(s):[],
    developSupply:s.developmentSupply,
    players:s.players.map(p=>({id:p.id,name:p.name,money:p.money,shares:p.shares})),
    companies:Object.fromEntries(COMPANY_IDS.map(id=>[id,{treasury:s.companies[id].treasury,income:s.companies[id].income,onMap:s.companies[id].onMap,cubes:s.companies[id].cubesInSupply,sharesInSupply:s.companies[id].sharesInSupply,removed:s.companies[id].removed}])),
    winner:s.winner,
    cubesOnBoard: Object.fromEntries(Object.entries(s.hexes).map(([k,v])=>[k,v.cubes]).filter(([k,v])=>v.length)),
    legalHexes: (function(){
      if (s.turnPhase==='developing') return legalDevelopHexes(s);
      if (s.turnPhase==='expanding' && s.pending && s.pending.companyId) return legalExpandHexes(s, s.currentPlayer, s.pending.companyId);
      if (s.turnPhase==='placeStartCube') return Object.keys(BOARD).filter(id=>{const hs=s.hexes[id];return BOARD[id].city&&(!hs||hs.cubes.length===0);});
      return [];
    })(),
    expandCompanies: s.turnPhase==='expanding' ? ownedExpandableCompanies(s, s.currentPlayer) : [],
  });
};
</script>
